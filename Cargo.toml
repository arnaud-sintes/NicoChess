[package]
name = "nicochess"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
httparse = "1.10.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
imageproc = { version = "0.27.0", default-features = false }
pico-args = "0.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
shakmaty = "0.30.2"

[target.'cfg(target_os = "linux")'.dependencies]
v4l = { version = "0.14.0", default-features = false, features = ["v4l2"] }

[target.'cfg(windows)'.dependencies]
# Webcam on Windows (Media Foundation). Frames are decoded here, not by nokhwa.
nokhwa = { version = "0.10.11", default-features = false, features = ["input-msmf"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

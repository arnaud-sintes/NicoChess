[package]
name = "nicochess-android"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "NicoChess for Android: the core library behind a JNI entry point"

[lib]
name = "nicochess_android"
crate-type = ["cdylib"]

[dependencies]
nicochess = { path = "../.." }
jni = "0.21"
libc = "0.2"
